{% extends "base.html" %}

{% block title %}
Edit Product - Zachify
{% endblock %}

{% block content %}

<div class="admin-container">

    <div class="admin-header">
        <div>
            <p class="admin-kicker">INVENTORY</p>
            <h1>Edit Product</h1>
            <p class="admin-subtitle">Update product information in your catalog.</p>
        </div>
        <div>
            <a href="{{ url_for('admin') }}" class="quick-btn" style="display: inline-flex; align-items: center; gap: 8px;">
                ← Back to Dashboard
            </a>
        </div>
    </div>

    <div class="admin-form-card">
        <form method="POST">

            <label style="color: #a78bfa; font-weight: 600; font-size: 13px; display: block; margin-bottom: 6px;">Product Name</label>
            <input type="text" name="name" value="{{ product.name }}" placeholder="Product Name" required>

            <label style="color: #a78bfa; font-weight: 600; font-size: 13px; display: block; margin-bottom: 6px; margin-top: 12px;">Price (₹)</label>
            <input type="number" step="0.01" name="price" value="{{ product.price }}" placeholder="Price" required>

            <label style="color: #a78bfa; font-weight: 600; font-size: 13px; display: block; margin-bottom: 6px; margin-top: 12px;">Image Filename</label>
            <input type="text" name="image" value="{{ product.image }}" placeholder="Image Filename" required>

            <label style="color: #a78bfa; font-weight: 600; font-size: 13px; display: block; margin-bottom: 6px; margin-top: 12px;">Category</label>
            <input type="text" name="category" value="{{ product.category }}" placeholder="Category" required>

            <label style="color: #a78bfa; font-weight: 600; font-size: 13px; display: block; margin-bottom: 6px; margin-top: 12px;">Product Description</label>
            <textarea name="description" rows="5" placeholder="Product Description" required>{{ product.description }}</textarea>

            <label style="color: #a78bfa; font-weight: 600; font-size: 13px; display: block; margin-bottom: 6px; margin-top: 12px;">Stock</label>
            <input type="number" name="stock" value="{{ product.stock }}" placeholder="Stock" required>

            <div style="display: flex; gap: 15px; margin-top: 20px;">
                <button type="submit">
                    Update Product
                </button>
                <a href="{{ url_for('admin') }}" class="quick-btn" style="background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);">
                    Cancel
                </a>
            </div>

        </form>
    </div>

</div>

{% endblock %}
